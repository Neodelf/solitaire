  <main class="container seo-text">
    <header class="article-header">
      <a href="/">World Solitaire</a>
      <a href="/#table" class="article-cta-btn">Play now</a>
    </header>
    <nav class="article-breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a><span>›</span><span>Feedback</span>
    </nav>

    <h1>Feedback</h1>
    <p>Tell us what works and what we should fix. Every message is read.</p>

    <form id="feedback-form" class="feedback-form" novalidate>
      <label for="feedback-name">Name</label>
      <input id="feedback-name" type="text" maxlength="100" autocomplete="name" required>

      <label for="feedback-email">Email</label>
      <input id="feedback-email" type="email" maxlength="200" autocomplete="email" required>

      <fieldset class="feedback-rating">
        <legend>Rating</legend>
        <label><input type="radio" name="rating" value="1" required> 1</label>
        <label><input type="radio" name="rating" value="2"> 2</label>
        <label><input type="radio" name="rating" value="3"> 3</label>
        <label><input type="radio" name="rating" value="4"> 4</label>
        <label><input type="radio" name="rating" value="5"> 5</label>
      </fieldset>

      <label for="feedback-message">Message</label>
      <textarea id="feedback-message" maxlength="2000" rows="6" required></textarea>

      <input id="feedback-website" class="feedback-hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

      <p id="feedback-error" class="feedback-error" hidden></p>
      <button type="submit" class="article-cta-btn">Send feedback</button>
    </form>

    <p id="feedback-thanks" class="feedback-thanks" hidden>Thank you. Your feedback has been sent.</p>
  </main>

  <script>
    (function () {
      var ENDPOINT = 'https://script.google.com/macros/s/AKfycbz4qaCHGUoPTgJ4iWC-hJAyzdwJnZOT0Xx9Pv21PADREUBloHJQ8V1QNKtlL9LL0NPS-w/exec';
      var form = document.getElementById('feedback-form');
      var thanks = document.getElementById('feedback-thanks');
      var errorEl = document.getElementById('feedback-error');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('feedback-name').value.trim();
        var email = document.getElementById('feedback-email').value.trim();
        var message = document.getElementById('feedback-message').value.trim();
        var ratingEl = form.querySelector('input[name="rating"]:checked');
        var rating = ratingEl ? parseInt(ratingEl.value, 10) : 0;
        if (!name || !email || email.indexOf('@') < 1 || !(rating >= 1 && rating <= 5) || !message) {
          errorEl.hidden = false;
          errorEl.textContent = 'Please fill in all fields with a valid email and rating.';
          return;
        }
        errorEl.hidden = true;
        if (document.getElementById('feedback-website').value) {
          form.hidden = true;
          thanks.hidden = false;
          return;
        }
        var params = new URLSearchParams();
        params.append('action', 'feedback');
        params.append('name', name.slice(0, 100));
        params.append('email', email.slice(0, 200));
        params.append('rating', String(rating));
        params.append('message', message.slice(0, 2000));
        params.append('locale', 'en');
        fetch(ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: params.toString()
        }).catch(function () {});
        form.hidden = true;
        thanks.hidden = false;
      });
    })();
  </script>
